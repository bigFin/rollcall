[package]
name = "rollcall"
version = "0.1.0"
edition = "2024"
description = "SSH-native control plane for resuming and monitoring coding-agent sessions"
repository = "https://github.com/bigFin/rollcall"
publish = false

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
glob = "0.3.4"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shlex = "2.0.1"
tempfile = "3.27.0"
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"
